plugins {
    alias(libs.plugins.loom) apply false
}

subprojects {
    apply plugin: 'java'

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }

    repositories {
        mavenCentral()
        mavenLocal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Nucleoid'
            url = 'https://maven.nucleoid.xyz'
        }
        maven {
            name = 'OpenCollab'
            url = 'https://repo.opencollab.dev/main/'
        }
        maven {
            name = 'central-snapshots'
            url = 'https://central.sonatype.com/repository/maven-snapshots/'
        }
    }
}

// Disable runServer and runClient tasks on individual mod subprojects
// so running `gradle runServer` or `gradle dev:runServer` only launches the unified :dev server.
subprojects {
    if (project.name != 'dev') {
        tasks.matching { it.name in ['runServer', 'runClient'] }.configureEach {
            enabled = false
        }
    }
}

tasks.register('runServer') {
    group = 'fabric'
    description = 'Launches the unified development server.'
    dependsOn(':dev:runServer')
}

tasks.register('runClient') {
    group = 'fabric'
    description = 'Launches the unified development client.'
    dependsOn(':dev:runClient')
}

tasks.register('clean', Delete) {
    group = 'build'
    description = 'Deletes the root build directory and all compiled output artifacts.'
    delete layout.buildDirectory
}

tasks.register('release', Copy) {
    group = 'build'
    description = 'Compiles all subproject Fabric mods and copies their JAR files into root build/libs.'
    destinationDir = layout.buildDirectory.dir("libs").get().asFile

    Set<String> excludedProjects = ["common", "dev"]
    def modProjects = subprojects.findAll { !excludedProjects.contains(it) }

    modProjects.each { subproject ->
        dependsOn subproject.tasks.matching { it.name in ['remapJar', 'jar'] }
        from(subproject.tasks.matching { it.name == 'remapJar' })
        from(subproject.tasks.matching { it.name == 'jar' })
    }

    include '*.jar'
    exclude '*-sources.jar'
    exclude '*-dev.jar'
}

