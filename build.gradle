plugins {
    alias(libs.plugins.loom) apply false
}

subprojects {
    apply plugin: 'java'

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }

    repositories {
        mavenCentral()
        mavenLocal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Nucleoid'
            url = 'https://maven.nucleoid.xyz'
        }
        maven {
            name = 'OpenCollab'
            url = 'https://repo.opencollab.dev/main/'
        }
        maven {
            name = 'central-snapshots'
            url = 'https://central.sonatype.com/repository/maven-snapshots/'
        }
    }
}

// Disable runServer and runClient tasks on individual mod subprojects
// so running `gradle runServer` or `gradle dev:runServer` only launches the unified :dev server.
subprojects {
    plugins.withId('net.fabricmc.loom') {
        if (project.name != 'dev') {
            tasks.matching { it.name in ['runServer', 'runClient'] }.configureEach {
                enabled = false
            }
        }
    }
}

tasks.register('runServer') {
    group = 'fabric'
    description = 'Launches the unified development server.'
    dependsOn(':dev:runServer')
}

tasks.register('runClient') {
    group = 'fabric'
    description = 'Launches the unified development client.'
    dependsOn(':dev:runClient')
}
