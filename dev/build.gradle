// Development-only aggregator: launches a single server with every Dystopia
// mod loaded together, instead of running one server per subproject.
//
//   ./gradlew :dev:runServer
//
base.archivesName.set("dev")
version = "0.0.0"
group = rootProject.property("maven_group").toString()

dependencies {
    minecraft(libs.minecraft)
    implementation(libs.fabric.loader)
    implementation(libs.fabric.api)

    // EdenMC API is consumed by DeathChest as a plain library (not bundled).
    implementation(libs.edenmc.api)

    // All Dystopia mods, loaded together into a single dev server.
    localRuntime(project(":common"))
    localRuntime(project(":deathchest"))
    localRuntime(project(":fasthoppers"))
    localRuntime(project(":itemfilter"))
    localRuntime(project(":instantrestock"))
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

abstract class DownloadTask extends DefaultTask {
    @Input
    abstract Property<String> getUrl()

    @OutputFile
    abstract RegularFileProperty getOutput()

    @TaskAction
    void download() {
        File destFile = output.get().asFile
        destFile.parentFile.mkdirs()
        URLConnection conn = new URI(url.get()).toURL().openConnection()
        conn.setRequestProperty("User-Agent", "Mozilla/5.0")
        conn.setConnectTimeout(15000)
        conn.setReadTimeout(30000)
        conn.inputStream.withStream { input ->
            destFile.withOutputStream { out ->
                out << input
            }
        }
    }
}

